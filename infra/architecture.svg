<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="sh" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-start">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-start">
      <path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-start">
      <path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-start">
      <path d="M0 0 L10 5 L0 10 z" fill="#ea8a00"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="820" fill="url(#bg)"/>

  <!-- Header -->
  <rect x="40" y="30" width="6" height="58" rx="3" fill="#ea8a00"/>
  <text x="62" y="58" font-size="27" font-weight="800" fill="#0f172a">Cinderwake Scribe — Cloud Architecture</text>
  <text x="62" y="83" font-size="14.5" fill="#64748b">Serverless Next.js on AWS Amplify · manuscripts in Amazon S3 · Claude co-writer with prompt caching</text>

  <!-- ===== AWS Cloud container ===== -->
  <rect x="290" y="130" width="770" height="600" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#ea8a00" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>
  <rect x="312" y="150" width="196" height="30" rx="15" fill="#fff4e5" stroke="#f0b46a"/>
  <text x="410" y="170" font-size="12.5" font-weight="700" fill="#b8620a" text-anchor="middle">AWS Cloud · us-east-1</text>

  <!-- ===================== CARDS ===================== -->
  <!-- DNS -->
  <g filter="url(#sh)"><rect x="40" y="196" width="188" height="72" rx="14" fill="#0ea5e9"/><rect x="46" y="196" width="182" height="72" rx="12" fill="#ffffff"/></g>
  <text x="137" y="228" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="middle">Amazon Route 53</text>
  <text x="137" y="248" font-size="11.5" fill="#64748b" text-anchor="middle">DNS · sreedharpanaman.com</text>

  <!-- Browser -->
  <g filter="url(#sh)"><rect x="40" y="300" width="188" height="96" rx="14" fill="#334155"/><rect x="46" y="300" width="182" height="96" rx="12" fill="#ffffff"/></g>
  <text x="137" y="338" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Author's Browser</text>
  <text x="137" y="360" font-size="11.5" fill="#64748b" text-anchor="middle">HTTPS</text>
  <text x="137" y="378" font-size="11.5" fill="#64748b" text-anchor="middle">single-password login</text>

  <!-- GitHub -->
  <g filter="url(#sh)"><rect x="40" y="606" width="188" height="90" rx="14" fill="#111827"/><rect x="46" y="606" width="182" height="90" rx="12" fill="#ffffff"/></g>
  <text x="137" y="642" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">GitHub</text>
  <text x="137" y="663" font-size="11.5" fill="#64748b" text-anchor="middle">panamania/scribe</text>
  <text x="137" y="680" font-size="11.5" fill="#64748b" text-anchor="middle">branch: cloud</text>

  <!-- ACM -->
  <g filter="url(#sh)"><rect x="330" y="196" width="190" height="70" rx="14" fill="#dc2626"/><rect x="336" y="196" width="184" height="70" rx="12" fill="#ffffff"/></g>
  <text x="428" y="227" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">Certificate Manager</text>
  <text x="428" y="247" font-size="11.5" fill="#64748b" text-anchor="middle">managed TLS cert</text>

  <!-- CloudFront -->
  <g filter="url(#sh)"><rect x="330" y="300" width="190" height="96" rx="14" fill="#2563eb"/><rect x="336" y="300" width="184" height="96" rx="12" fill="#ffffff"/></g>
  <text x="428" y="338" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Amazon CloudFront</text>
  <text x="428" y="360" font-size="11.5" fill="#64748b" text-anchor="middle">global CDN</text>
  <text x="428" y="378" font-size="11.5" fill="#64748b" text-anchor="middle">TLS termination</text>

  <!-- IAM -->
  <g filter="url(#sh)"><rect x="560" y="196" width="200" height="70" rx="14" fill="#dc2626"/><rect x="566" y="196" width="194" height="70" rx="12" fill="#ffffff"/></g>
  <text x="663" y="227" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">IAM Role</text>
  <text x="663" y="247" font-size="11.5" fill="#64748b" text-anchor="middle">scoped S3 access</text>

  <!-- SSR Compute -->
  <g filter="url(#sh)"><rect x="560" y="300" width="200" height="150" rx="14" fill="#4f46e5"/><rect x="566" y="300" width="194" height="150" rx="12" fill="#ffffff"/></g>
  <text x="663" y="333" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Amplify SSR Compute</text>
  <text x="663" y="352" font-size="11.5" fill="#64748b" text-anchor="middle">AWS Lambda · Next.js</text>
  <line x1="584" y1="364" x2="742" y2="364" stroke="#e2e8f0"/>
  <text x="663" y="384" font-size="11.5" fill="#334155" text-anchor="middle">middleware → Basic Auth</text>
  <text x="663" y="404" font-size="11.5" fill="#334155" text-anchor="middle">/api/generate</text>
  <text x="663" y="422" font-size="11.5" fill="#334155" text-anchor="middle">/api/…/canoncheck</text>
  <text x="663" y="440" font-size="11.5" fill="#334155" text-anchor="middle">/api/chapters · export</text>

  <!-- S3 -->
  <g filter="url(#sh)"><rect x="800" y="196" width="210" height="112" rx="14" fill="#059669"/><rect x="806" y="196" width="204" height="112" rx="12" fill="#ffffff"/></g>
  <text x="905" y="230" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Amazon S3 (private)</text>
  <text x="905" y="252" font-size="11.5" fill="#64748b" text-anchor="middle">chapters · canon · covers</text>
  <text x="905" y="270" font-size="11.5" fill="#64748b" text-anchor="middle">book.json · settings</text>
  <text x="905" y="291" font-size="11.5" fill="#64748b" text-anchor="middle">versioned · encrypted</text>

  <!-- CloudWatch -->
  <g filter="url(#sh)"><rect x="800" y="470" width="210" height="86" rx="14" fill="#0891b2"/><rect x="806" y="470" width="204" height="86" rx="12" fill="#ffffff"/></g>
  <text x="905" y="504" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="middle">CloudWatch Logs</text>
  <text x="905" y="526" font-size="11.5" fill="#64748b" text-anchor="middle">[cache] read / write tokens</text>

  <!-- Amplify CI/CD -->
  <g filter="url(#sh)"><rect x="560" y="566" width="200" height="118" rx="14" fill="#ea8a00"/><rect x="566" y="566" width="194" height="118" rx="12" fill="#ffffff"/></g>
  <text x="663" y="600" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Amplify CI/CD</text>
  <text x="663" y="622" font-size="11.5" fill="#64748b" text-anchor="middle">webhook on push</text>
  <text x="663" y="640" font-size="11.5" fill="#64748b" text-anchor="middle">npm ci · next build</text>
  <text x="663" y="662" font-size="11.5" fill="#64748b" text-anchor="middle">(amplify.yml)</text>

  <!-- Anthropic (external) -->
  <g filter="url(#sh)"><rect x="1080" y="330" width="150" height="104" rx="14" fill="#7c3aed"/><rect x="1086" y="330" width="144" height="104" rx="12" fill="#ffffff"/></g>
  <text x="1158" y="366" font-size="14.5" font-weight="700" fill="#5b21b6" text-anchor="middle">Anthropic API</text>
  <text x="1158" y="387" font-size="11.5" fill="#7c3aed" text-anchor="middle">Claude</text>
  <text x="1158" y="404" font-size="11.5" fill="#7c3aed" text-anchor="middle">prompt caching</text>
  <text x="1158" y="421" font-size="11.5" fill="#7c3aed" text-anchor="middle">(~90% cheaper reads)</text>

  <!-- ===================== CONNECTORS ===================== -->
  <!-- (1) Browser -> Route53 -->
  <path d="M137 300 L137 272" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/>
  <!-- (2) Browser -> CloudFront -->
  <path d="M228 348 L326 348" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <!-- CloudFront -> SSR -->
  <path d="M520 348 L556 348" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="538" y="338" font-size="10.5" fill="#64748b" text-anchor="middle">SSR</text>
  <!-- ACM -> CloudFront -->
  <path d="M428 266 L428 296" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="470" y="286" font-size="10.5" fill="#b91c1c" text-anchor="middle">cert</text>
  <!-- IAM -> SSR -->
  <path d="M663 266 L663 296" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="663" y="286" font-size="10.5" fill="#b91c1c" text-anchor="middle">assume</text>
  <!-- (3) SSR -> S3 -->
  <path d="M760 330 L802 274" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <!-- (4) SSR -> Anthropic -->
  <path d="M760 378 L1078 381" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#ap)"/>
  <!-- SSR -> CloudWatch -->
  <path d="M706 450 L860 470" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#a)"/>
  <text x="756" y="466" font-size="10.5" fill="#64748b" text-anchor="middle">logs</text>
  <!-- (5) GitHub -> CI/CD -->
  <path d="M228 648 L556 628" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <!-- (6) CI/CD -> SSR (deploy) -->
  <path d="M663 566 L663 454" fill="none" stroke="#ea8a00" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ao)"/>

  <!-- ===================== STEP BADGES ===================== -->
  <g font-size="12.5" font-weight="800" fill="#ffffff" text-anchor="middle">
    <circle cx="137" cy="286" r="11" fill="#0f172a"/><text x="137" y="290">1</text>
    <circle cx="284" cy="348" r="11" fill="#0f172a"/><text x="284" y="352">2</text>
    <circle cx="789" cy="298" r="11" fill="#0f172a"/><text x="789" y="302">3</text>
    <circle cx="905" cy="381" r="11" fill="#7c3aed"/><text x="905" y="385">4</text>
    <circle cx="392" cy="638" r="11" fill="#ea8a00"/><text x="392" y="642">5</text>
    <circle cx="663" cy="510" r="11" fill="#ea8a00"/><text x="663" y="514">6</text>
  </g>

  <!-- ===================== LEGEND ===================== -->
  <line x1="40" y1="744" x2="1200" y2="744" stroke="#e2e8f0"/>
  <g font-size="12" fill="#475569">
    <text x="40" y="768" font-weight="700" fill="#0f172a">Request path</text>
    <text x="40" y="787">1  resolve domain   ·   2  HTTPS → CloudFront → SSR   ·   3  read / write manuscripts in S3   ·   4  co-writer call to Claude (cached)</text>
    <text x="40" y="806" font-weight="700" fill="#0f172a">Delivery path<tspan font-weight="400" fill="#475569">    5  git push to cloud branch   ·   6  Amplify builds &amp; deploys the SSR app</tspan></text>
  </g>
</svg>
