<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-start">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-start">
      <path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
  <text x="24" y="36" font-size="22" font-weight="700" fill="#0f172a">Cinderwake Scribe — AWS Architecture</text>
  <text x="24" y="58" font-size="13" fill="#64748b">Next.js (SSR) on Amplify Hosting · books in S3 · Anthropic co-writer with prompt caching</text>

  <!-- ===================== EXTERNAL ===================== -->
  <text x="24" y="92" font-size="12" font-weight="700" fill="#94a3b8">EXTERNAL</text>

  <!-- Browser -->
  <rect x="24" y="104" width="184" height="70" rx="10" fill="#f8fafc" stroke="#475569"/>
  <text x="116" y="134" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Author's Browser</text>
  <text x="116" y="154" font-size="11" fill="#64748b" text-anchor="middle">HTTPS + Basic-Auth login</text>

  <!-- GitHub -->
  <rect x="24" y="300" width="184" height="70" rx="10" fill="#f8fafc" stroke="#475569"/>
  <text x="116" y="330" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">GitHub</text>
  <text x="116" y="350" font-size="11" fill="#64748b" text-anchor="middle">panamania/scribe · cloud</text>

  <!-- Anthropic -->
  <rect x="24" y="520" width="184" height="80" rx="10" fill="#faf5ff" stroke="#7c3aed"/>
  <text x="116" y="550" font-size="14" font-weight="600" fill="#5b21b6" text-anchor="middle">Anthropic API</text>
  <text x="116" y="569" font-size="11" fill="#7c3aed" text-anchor="middle">Claude (Opus/Sonnet/Haiku)</text>
  <text x="116" y="585" font-size="11" fill="#7c3aed" text-anchor="middle">prompt caching enabled</text>

  <!-- DNS -->
  <rect x="256" y="112" width="150" height="54" rx="10" fill="#f8fafc" stroke="#475569"/>
  <text x="331" y="136" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">DNS (Route 53 /</text>
  <text x="331" y="153" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">registrar)</text>

  <!-- ===================== AWS ACCOUNT ===================== -->
  <rect x="250" y="190" width="726" height="486" rx="14" fill="none" stroke="#ff9900" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="270" y="214" font-size="13" font-weight="700" fill="#c2410c">AWS ACCOUNT — region: us-east-1</text>

  <!-- Amplify Hosting container -->
  <rect x="272" y="228" width="682" height="196" rx="12" fill="#fff7ed" stroke="#fb923c"/>
  <text x="288" y="250" font-size="13" font-weight="700" fill="#c2410c">AWS Amplify Hosting</text>

  <!-- CloudFront -->
  <rect x="290" y="262" width="210" height="60" rx="9" fill="#eff6ff" stroke="#2563eb"/>
  <text x="395" y="287" font-size="13" font-weight="600" fill="#1e3a8a" text-anchor="middle">Amazon CloudFront</text>
  <text x="395" y="305" font-size="11" fill="#3b82f6" text-anchor="middle">global CDN + TLS termination</text>

  <!-- ACM -->
  <rect x="290" y="340" width="210" height="56" rx="9" fill="#eff6ff" stroke="#2563eb"/>
  <text x="395" y="363" font-size="12.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">AWS Certificate Manager</text>
  <text x="395" y="381" font-size="11" fill="#3b82f6" text-anchor="middle">managed SSL cert</text>

  <!-- SSR Compute -->
  <rect x="524" y="262" width="200" height="134" rx="9" fill="#eff6ff" stroke="#2563eb"/>
  <text x="624" y="286" font-size="13" font-weight="600" fill="#1e3a8a" text-anchor="middle">SSR Compute (Lambda)</text>
  <text x="624" y="308" font-size="11" fill="#3b82f6" text-anchor="middle">Next.js pages + API routes</text>
  <text x="624" y="326" font-size="11" fill="#3b82f6" text-anchor="middle">middleware.js → Basic Auth</text>
  <text x="624" y="350" font-size="11" fill="#3b82f6" text-anchor="middle">/api/generate</text>
  <text x="624" y="368" font-size="11" fill="#3b82f6" text-anchor="middle">/api/…/canoncheck</text>

  <!-- CI/CD -->
  <rect x="746" y="262" width="192" height="134" rx="9" fill="#eff6ff" stroke="#2563eb"/>
  <text x="842" y="290" font-size="13" font-weight="600" fill="#1e3a8a" text-anchor="middle">Amplify CI/CD</text>
  <text x="842" y="312" font-size="11" fill="#3b82f6" text-anchor="middle">build from `cloud`</text>
  <text x="842" y="330" font-size="11" fill="#3b82f6" text-anchor="middle">npm ci · next build</text>
  <text x="842" y="352" font-size="11" fill="#3b82f6" text-anchor="middle">(amplify.yml)</text>

  <!-- S3 -->
  <rect x="290" y="452" width="228" height="92" rx="9" fill="#ecfdf5" stroke="#059669"/>
  <text x="404" y="480" font-size="13" font-weight="600" fill="#065f46" text-anchor="middle">Amazon S3 (private)</text>
  <text x="404" y="500" font-size="11" fill="#059669" text-anchor="middle">chapters · canon · covers</text>
  <text x="404" y="517" font-size="11" fill="#059669" text-anchor="middle">book.json · settings · versioned</text>

  <!-- IAM role -->
  <rect x="546" y="452" width="180" height="74" rx="9" fill="#fef2f2" stroke="#dc2626"/>
  <text x="636" y="482" font-size="13" font-weight="600" fill="#991b1b" text-anchor="middle">IAM role</text>
  <text x="636" y="502" font-size="11" fill="#dc2626" text-anchor="middle">Amplify → S3 access</text>

  <!-- CloudWatch -->
  <rect x="752" y="452" width="186" height="74" rx="9" fill="#f1f5f9" stroke="#475569"/>
  <text x="845" y="482" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">CloudWatch Logs</text>
  <text x="845" y="502" font-size="11" fill="#64748b" text-anchor="middle">[cache] read/write tokens</text>

  <!-- ===================== ARROWS ===================== -->
  <!-- Browser -> DNS -->
  <path d="M208 128 L254 132" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="214" y="120" font-size="10.5" fill="#334155">resolve</text>
  <!-- DNS -> CloudFront -->
  <path d="M331 166 L360 260" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- Browser -> CloudFront (HTTPS) -->
  <path d="M208 150 C 360 190, 300 230, 330 260" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="234" y="205" font-size="10.5" fill="#334155">HTTPS request</text>

  <!-- CloudFront -> SSR -->
  <path d="M500 292 L522 300" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="486" y="284" font-size="10.5" fill="#334155">SSR</text>
  <!-- ACM -> CloudFront -->
  <path d="M395 340 L395 324" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="400" y="336" font-size="10.5" fill="#334155">cert</text>

  <!-- SSR -> S3 -->
  <path d="M560 396 C 520 430, 470 430, 430 450" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="452" y="430" font-size="10.5" fill="#334155">read / write</text>
  <!-- SSR <-> IAM (assumes) -->
  <path d="M636 452 L632 398" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="640" y="428" font-size="10.5" fill="#b91c1c">assumes role</text>

  <!-- SSR -> Anthropic -->
  <path d="M524 356 C 320 380, 200 430, 150 518" fill="none" stroke="#7c3aed" stroke-width="1.9" marker-end="url(#arrow)"/>
  <text x="250" y="452" font-size="10.5" fill="#6d28d9">generate / canon-check (cached)</text>

  <!-- SSR -> CloudWatch -->
  <path d="M700 396 C 780 420, 820 428, 840 450" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="756" y="424" font-size="10.5" fill="#334155">logs</text>

  <!-- GitHub -> CI/CD -->
  <path d="M208 320 C 500 300, 640 300, 744 312" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="470" y="296" font-size="10.5" fill="#334155">push to cloud → webhook build</text>
  <!-- CI/CD -> CloudFront/SSR (deploy) -->
  <path d="M842 396 C 842 420, 700 250, 636 262" fill="none" stroke="#c2410c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowO)"/>
  <text x="700" y="238" font-size="10.5" fill="#c2410c">deploy</text>

  <!-- Legend -->
  <text x="24" y="648" font-size="11" fill="#94a3b8">Data plane: Browser → CloudFront → SSR → S3 / Anthropic.  Build plane (dashed): GitHub → CI/CD → deploy.  IAM (red) grants S3 access.</text>
</svg>
